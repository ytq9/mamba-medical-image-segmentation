[project]
name = "scan-geometry-matching"
version = "0.1.0"
description = "Dataset manifest and geometry audit tools for Mamba scan-strategy matching experiments."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "matplotlib>=3.7",
  "Pillow>=9.0",
  "nibabel>=5.0",
  "SimpleITK>=2.3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]
train = [
  "torch>=2.0",
  "mamba-ssm>=2.2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
